<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel Grid Viewer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Calibri, Arial, sans-serif; background: #f0f0f0; font-size: 11px; }

/* ── Toolbar ── */
#toolbar {
  position: sticky; top: 0; z-index: 100;
  background: #217346; color: #fff;
  padding: 6px 12px; display: flex; align-items: center; gap: 10px;
  box-shadow: 0 2px 4px rgba(0,0,0,.3);
}
#toolbar h1 { font-size: 13px; font-weight: 600; flex: 1; }
#toolbar select, #toolbar button {
  padding: 3px 8px; border-radius: 3px; border: none;
  font-size: 11px; cursor: pointer;
}
#toolbar select { background: #fff; color: #333; }
#toolbar button { background: #1a5c38; color: #fff; }
#toolbar button:hover { background: #13432a; }

/* ── Wrapper: sticky col headers + scrollable body ── */
#sheet-wrap {
  position: relative;
  overflow: auto;
  max-height: calc(100vh - 40px);
  background: #fff;
}

/* ── Table ── */
#excel-table {
  border-collapse: collapse;
  table-layout: fixed;
  font-family: Calibri, Arial, sans-serif;
  font-size: 11px;
}

/* Row-number column */
.rn {
  background: #f2f2f2;
  color: #666;
  text-align: center;
  font-size: 10px;
  border: 1px solid #d0d0d0;
  min-width: 28px;
  width: 28px;
  position: sticky;
  left: 0;
  z-index: 3;
  user-select: none;
}

/* Column-letter header row */
thead .ch {
  background: #f2f2f2;
  color: #444;
  text-align: center;
  font-size: 10px;
  border: 1px solid #d0d0d0;
  position: sticky;
  top: 0;
  z-index: 4;
  user-select: none;
  font-weight: normal;
}
thead .corner {
  position: sticky; top: 0; left: 0; z-index: 5;
  background: #e8e8e8;
  border: 1px solid #d0d0d0;
  width: 28px;
}

/* Data cells */
td.xc {
  border: 1px solid #d4d4d4;
  padding: 1px 3px;
  overflow: hidden;
  vertical-align: bottom;
  white-space: nowrap;
  position: relative;
}
td.xc.wrap-text { white-space: pre-wrap; }
td.xc.v-center { vertical-align: middle; }
td.xc.v-top    { vertical-align: top; }

/* Border styles */
.b-thin        { border-color: #BFBFBF; }
.b-medium      { border-width: 2px; border-color: #8c8c8c; }
.b-thick       { border-width: 3px; border-color: #595959; }
.border-left-thin   { border-left: 1px solid #BFBFBF; }
.border-right-thin  { border-right: 1px solid #BFBFBF; }
.border-top-thin    { border-top: 1px solid #BFBFBF; }
.border-bottom-thin { border-bottom: 1px solid #BFBFBF; }
.border-left-medium   { border-left: 2px solid #8c8c8c; }
.border-right-medium  { border-right: 2px solid #8c8c8c; }
.border-top-medium    { border-top: 2px solid #8c8c8c; }
.border-bottom-medium { border-bottom: 2px solid #8c8c8c; }
.border-left-thick   { border-left: 3px solid #595959; }
.border-right-thick  { border-right: 3px solid #595959; }
.border-top-thick    { border-top: 3px solid #595959; }
.border-bottom-thick { border-bottom: 3px solid #595959; }

/* Loading / error states */
#status {
  position: fixed; bottom: 12px; right: 12px;
  background: rgba(0,0,0,.7); color: #fff;
  padding: 6px 12px; border-radius: 4px;
  font-size: 11px; display: none;
}
</style>
</head>
<body>

<div id="toolbar">
  <h1 id="project-title">Excel Grid Viewer</h1>
  <label style="font-size:11px">Project:
    <select id="project-select" onchange="loadProject(this.value)">
      <option value="">Loading...</option>
    </select>
  </label>
  <button onclick="reloadSheet()">↻ Refresh</button>
</div>

<div id="sheet-wrap">
  <div id="loading" style="padding:40px;text-align:center;color:#666;font-size:13px">
    Loading projects...
  </div>
  <table id="excel-table" style="display:none"></table>
</div>
<div id="status"></div>

<script>
/* ─────────────────────────────────────────────
   CONFIG – point to your Flask server
   ───────────────────────────────────────────── */
const API_BASE = window.location.origin;  // same origin as Flask

/* ─────────────────────────────────────────────
   BOOTSTRAP
   ───────────────────────────────────────────── */
let currentProjectId = null;

async function boot() {
  try {
    const projects = await apiFetch("/api/projects");
    const sel = document.getElementById("project-select");
    sel.innerHTML = '<option value="">— Select project —</option>' +
      projects.map(p =>
        `<option value="${p.id}">${p.or_number || p.id} – ${p.customer_name || ''}</option>`
      ).join("");
  } catch(e) {
    document.getElementById("loading").textContent = "Error: " + e.message + " (make sure you're logged in)";
  }
}

async function loadProject(id) {
  if (!id) return;
  currentProjectId = id;
  showLoading("Loading sheet…");
  try {
    const data = await apiFetch(`/api/projects/${id}/sheet`);
    document.getElementById("project-title").textContent = id;
    renderSheet(data);
  } catch(e) {
    document.getElementById("loading").textContent = "Error: " + e.message;
    document.getElementById("loading").style.display = "block";
    document.getElementById("excel-table").style.display = "none";
  } finally {
    hideLoading();
  }
}

function reloadSheet() {
  if (currentProjectId) loadProject(currentProjectId);
}

/* ─────────────────────────────────────────────
   RENDER
   ───────────────────────────────────────────── */
function renderSheet(data) {
  const { cells, col_widths, row_heights, max_row, max_col, cols } = data;
  const table = document.getElementById("excel-table");
  table.innerHTML = "";

  /* ── THEAD: column letters ── */
  const thead = table.createTHead();
  const hrow  = thead.insertRow();
  // corner cell
  const corner = document.createElement("th");
  corner.className = "rn corner";
  hrow.appendChild(corner);
  // column letters
  for (const col of cols) {
    const th = document.createElement("th");
    th.className = "ch";
    th.textContent = col;
    th.style.width = (col_widths[col] || 64) + "px";
    th.style.minWidth = th.style.width;
    hrow.appendChild(th);
  }

  /* ── TBODY: rows ── */
  const tbody = table.createTBody();
  for (let r = 1; r <= max_row; r++) {
    const tr = tbody.insertRow();
    const rh = (row_heights[String(r)] || 20);
    tr.style.height = rh + "px";

    // row number
    const rn = document.createElement("td");
    rn.className = "rn";
    rn.textContent = r;
    tr.appendChild(rn);

    // cells
    for (let ci = 0; ci < cols.length; ci++) {
      const col   = cols[ci];
      const coord = col + r;
      const info  = cells[coord];

      if (!info || info.skip) {
        // merged slave: skip (handled by rowspan/colspan on master)
        if (info && info.skip) continue;
        // empty cell
        const td = document.createElement("td");
        td.className = "xc";
        td.style.width    = (col_widths[col] || 64) + "px";
        td.style.minWidth = td.style.width;
        tr.appendChild(td);
        continue;
      }

      const td = document.createElement("td");
      td.className = "xc";

      // ── width / height ──
      td.style.width    = (col_widths[col] || 64) + "px";
      td.style.minWidth = td.style.width;

      // ── merge ──
      if (info.rowspan) td.rowSpan = info.rowspan;
      if (info.colspan) td.colSpan = info.colspan;

      // ── fill (background) ──
      if (info.fill) td.style.backgroundColor = info.fill;

      // ── font ──
      if (info.font) {
        const f = info.font;
        if (f.bold)      td.style.fontWeight  = "bold";
        if (f.italic)    td.style.fontStyle   = "italic";
        if (f.underline) td.style.textDecoration = "underline";
        if (f.size)      td.style.fontSize    = f.size + "px";
        if (f.color)     td.style.color       = f.color;
      }

      // ── alignment ──
      if (info.align) {
        const a = info.align;
        if (a.h) {
          if      (a.h === "center" || a.h === "centerContinuous") td.style.textAlign = "center";
          else if (a.h === "right")  td.style.textAlign = "right";
          else if (a.h === "left")   td.style.textAlign = "left";
        }
        if (a.v) {
          if      (a.v === "center") td.classList.add("v-center");
          else if (a.v === "top")    td.classList.add("v-top");
        }
        if (a.wrap) td.classList.add("wrap-text");
      }

      // ── borders ──
      if (info.border) {
        const b = info.border;
        for (const side of ["left","right","top","bottom"]) {
          if (b[side]) {
            const weight = b[side];
            td.classList.add(`border-${side}-${weight}`);
          }
        }
      }

      // ── value ──
      if (info.v !== null && info.v !== undefined) {
        td.textContent = String(info.v);
      }

      tr.appendChild(td);
    }
  }

  document.getElementById("loading").style.display = "none";
  table.style.display = "";
}

/* ─────────────────────────────────────────────
   HELPERS
   ───────────────────────────────────────────── */
async function apiFetch(path) {
  const res = await fetch(API_BASE + path, { credentials: "include" });
  if (!res.ok) {
    const d = await res.json().catch(() => ({}));
    throw new Error(d.error || `HTTP ${res.status}`);
  }
  return res.json();
}

function showLoading(msg) {
  const s = document.getElementById("status");
  s.textContent = msg;
  s.style.display = "block";
}
function hideLoading() {
  document.getElementById("status").style.display = "none";
}

/* ─────────────────────────────────────────────
   INIT
   ───────────────────────────────────────────── */
boot();
</script>
</body>
</html>
